name: Deployment Dry Run
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-release-candidate:
    name: Build release candidate (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-release.sh "${RUNNER_TEMP}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: manguolabs-release-dry-run
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1
