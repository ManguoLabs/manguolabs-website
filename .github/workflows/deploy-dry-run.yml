name: Deployment Dry Run

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-release-candidate:
    name: Build release candidate (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Assemble isolated release candidate
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/manguolabs-release"
          mkdir -p "$stage"

          files=(
            index.html
            robots.txt
            sitemap.xml
          )
          directories=(
            assets
            articles
            node-firewall
            xboard-security-audit
            xboard-node-extension
          )

          for path in "${files[@]}"; do
            test -f "$path"
            cp "$path" "$stage/"
          done

          for path in "${directories[@]}"; do
            test -d "$path"
            cp -a "$path" "$stage/"
          done

          find "$stage" -type f -name .gitkeep -delete

          forbidden_paths=$(find "$stage" \( \
            \( -type d \( -name .git -o -name .github \) \) -o \
            \( -type f \( \
              -name README.md -o -name DEPLOY.md -o -name CHANGELOG.md -o \
              -name '.env' -o -name '.env.*' -o -name '*.pem' -o \
              -name '*.key' -o -name '*.sql' -o -name '*.sqlite' -o \
              -name '*.sqlite.*' -o -name 'id_rsa*' -o -name 'id_ed25519*' \
            \) \) \
          \) -print)
          if test -n "$forbidden_paths"; then
            echo "Forbidden file or directory detected in release candidate:"
            echo "$forbidden_paths"
            exit 1
          fi

          while IFS= read -r -d '' article; do
            test -f "$stage/$article" || {
              echo "Published article is missing from release candidate: $article"
              exit 1
            }
          done < <(find articles -mindepth 2 -maxdepth 2 -type f \
            -name index.html -print0)

          while IFS= read -r site_path; do
            if test -z "$site_path"; then
              page=index.html
            else
              page="${site_path%/}/index.html"
            fi
            if test -f "$page"; then
              test -f "$stage/$page" || {
                echo "Sitemap page is missing from release candidate: $page"
                exit 1
              }
            fi
          done < <(sed -n \
            's#.*<loc>https://manguolabs.com/\([^<]*\)</loc>.*#\1#p' \
            sitemap.xml)

          required_release_paths=(
            assets/style.css
            assets/favicon.svg
            articles/index.html
            articles/transit-ip-blocked/index.html
            node-firewall/index.html
            xboard-security-audit/index.html
            xboard-node-extension/index.html
            index.html
            robots.txt
            sitemap.xml
          )
          for path in "${required_release_paths[@]}"; do
            test -f "$stage/$path"
          done

          (
            cd "$stage"
            find . -type f ! -name MANIFEST.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
            sha256sum --check MANIFEST.sha256
          )

          tar -C "$stage" -czf "$RUNNER_TEMP/manguolabs-release.tar.gz" .
          tar -tzf "$RUNNER_TEMP/manguolabs-release.tar.gz" \
            > "$RUNNER_TEMP/manguolabs-release-contents.txt"

          while IFS= read -r -d '' article; do
            grep -Fxq "./$article" \
              "$RUNNER_TEMP/manguolabs-release-contents.txt" || {
                echo "Published article is missing from release archive: $article"
                exit 1
              }
          done < <(find articles -mindepth 2 -maxdepth 2 -type f \
            -name index.html -print0)

          release_file_count=$(find "$stage" -type f | wc -l)
          article_page_count=$(find "$stage/articles" -mindepth 2 -maxdepth 2 \
            -type f -name index.html | wc -l)
          manifest_entry_count=$(wc -l < "$stage/MANIFEST.sha256")
          echo "Release candidate file count: $release_file_count"
          echo "Article page count: $article_page_count"
          echo "Manifest entry count: $manifest_entry_count"
          echo "Release candidate assembled locally on the GitHub runner."
          echo "No server connection or deployment command was executed."

      - name: Verify no deployment credentials are configured
        shell: bash
        env:
          TEST_SSH_KEY: ${{ secrets.MANGUO_SSH_KEY }}
          TEST_HOST: ${{ secrets.MANGUO_HOST }}
        run: |
          set -euo pipefail
          test -z "$TEST_SSH_KEY"
          test -z "$TEST_HOST"
          echo "No deployment credentials are available to this workflow."

      - name: Upload test release artifact
        uses: actions/upload-artifact@v4
        with:
          name: manguolabs-release-dry-run
          path: ${{ runner.temp }}/manguolabs-release.tar.gz
          if-no-files-found: error
          retention-days: 1
