name: Website CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-site:
    name: Validate static website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate approved file set
        shell: bash
        run: |
          set -euo pipefail
          allowed_file="$(mktemp)"
          actual_file="$(mktemp)"
          printf '%s\n' \
            .github/workflows/ci.yml \
            assets/css/style.css \
            assets/js/main.js \
            index.html \
            node-firewall.html \
            robots.txt \
            sitemap.xml \
            xboard-node-extension.html \
            xboard-security-audit.html \
            articles/node-firewall.html \
            articles/xboard-node-extension.html \
            articles/xboard-security-audit.html \
            > "$allowed_file"
          find . -type f -not -path './.git/*' -print | sed 's#^./##' | LC_ALL=C sort > "$actual_file"
          LC_ALL=C sort -o "$allowed_file" "$allowed_file"
          diff -u "$allowed_file" "$actual_file"

      - name: Reject sensitive file names
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -not -path './.git/*' \( \
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o \
            -name '*.key' -o -name 'id_rsa*' -o -name 'id_ed25519*' -o \
            -name '*.sql' -o -name '*.sqlite*' \
          \) -print | grep -q .; then
            echo "Sensitive file name detected."
            exit 1
          fi

      - name: Validate HTML and XML files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class StrictEnoughHTMLParser(HTMLParser):
              def error(self, message):
                  raise ValueError(message)

          for path in Path(".").rglob("*.html"):
              parser = StrictEnoughHTMLParser()
              parser.feed(path.read_text(encoding="utf-8"))
              parser.close()

          ET.parse("sitemap.xml")
          print("Validated HTML and sitemap.xml")
          PY
