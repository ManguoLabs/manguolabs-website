name: Website CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-static-site:
    name: Validate static website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-contact-routing.mjs .
      - run: node scripts/validate-seo.mjs
      - run: node scripts/test-github-markdown.mjs
